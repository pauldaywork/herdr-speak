id = "speak"
name = "Speak"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Read the focused agent's last answer aloud through a local Kokoro TTS server"
platforms = ["linux", "macos"]

# Press once to speak the focused pane's last Claude or pi answer; press again
# while it is preparing or playing to stop it.
[[actions]]
id = "last"
title = "Speak: read the last answer aloud (again to stop)"
contexts = ["pane"]
command = ["python3", "speak.py", "toggle"]

[[actions]]
id = "last-verbatim"
title = "Speak: read the last answer as written, without the spoken rewrite"
contexts = ["pane"]
command = ["python3", "speak.py", "toggle", "--verbatim"]

[[actions]]
id = "stop"
title = "Speak: stop playback"
contexts = ["pane"]
command = ["python3", "speak.py", "stop"]

# Press to pick a markdown plan and hear it; press again while it plays to stop.
[[actions]]
id = "plan"
title = "Speak: pick a plan file and read it aloud (again to stop)"
contexts = ["pane"]
command = ["python3", "speak.py", "plan"]

# Select text in a pane, then press to hear it rewritten, shown beside the pane
# with live captions and a player; press again while it is preparing to cancel.
[[actions]]
id = "selection"
title = "Speak: read the selected text aloud (again to cancel preparing)"
contexts = ["pane", "selection"]
command = ["python3", "speak.py", "selection"]

# Opened by the plan action in the focused pane's cwd, so it reaches speak.py
# through HERDR_PLUGIN_ROOT rather than a relative path.
[[panes]]
id = "plan-picker"
title = "Speak: pick a plan"
placement = "overlay"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/speak.py\" pick"]

# Opened by the plan picker's "Last answer", focused, to the right of the pane the
# key was pressed in: the answer's paragraphs, all ticked. Enter speaks the ticked
# ones as a selection; Esc closes it.
[[panes]]
id = "paragraphs"
title = "Speak: pick paragraphs · space tick · enter speak · esc cancel"
placement = "split"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/speak.py\" paragraphs"]

# Opened to the right of the pane the key was pressed in, showing the picked plan,
# or the text a selection started from, read-only while it is spoken. Both are
# markdown, even a selection saved as .txt. Quit nvim to close it.
[[panes]]
id = "plan-view"
title = "Speak: text"
placement = "split"
command = ["sh", "-c", "exec nvim -R -c \"set filetype=markdown\" \"$SPEAK_PLAN\""]

# Opened under the plan's pane once its audio is saved: mpv with a progress bar,
# so the plan can be replayed, paused and scrubbed. q closes it.
[[panes]]
id = "plan-player"
title = "Speak: player · space pause · ←/→ 5s · ↑/↓ 1m · q close"
placement = "split"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/speak.py\" player"]

# Opened by a worker while it prepares a plan or selection, where its panes will
# appear: a spinner and the seconds so far. The worker closes it when it is done.
[[panes]]
id = "preparing"
title = "Speak: preparing · press the key again to cancel"
placement = "split"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/speak.py\" preparing"]

# Opened by speak.selection under the text pane: sptlrx shows the spoken rewrite as
# captions in step with the mpv player under it, the spoken sentence in bold. q closes it.
[[panes]]
id = "captions"
title = "Speak: captions · q close"
placement = "split"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/speak.py\" captions"]
